# Phase 1 source registry.
# enabled=true means the adapter may run. Attempted vs not-searched is still
# reported honestly in SourceHealth (e.g. missing API key or empty alert dir).

defaults:
  timeout_seconds: 30
  max_retries: 3

aggregators:
  jsearch:
    enabled: true
    requires_env: JSEARCH_API_KEY
    status: implemented
    detail: RapidAPI JSearch — skipped when JSEARCH_API_KEY is absent
  jooble:
    enabled: false
    requires_env: JOOBLE_API_KEY
    status: planned

ats_public:
  greenhouse:
    enabled: true
    status: implemented
    # Public board tokens verified reachable during Phase 1 setup.
    boards:
      - careem
      - tamara
      - binance
      - bybit
      - coinbase
      - elastic
      - mongodb
      - scaleai
  lever:
    enabled: true
    status: implemented
    sites:
      - palantir
      - spotify
  ashby:
    enabled: true
    status: implemented
    boards:
      - openai
  smartrecruiters:
    enabled: false
    status: planned
  workday:
    enabled: false
    status: planned_conditional
  oracle_recruiting:
    enabled: false
    status: planned_conditional
  sap_successfactors:
    enabled: false
    status: planned_conditional

job_boards:
  # No authorized live search API — alert JSON ingestion only.
  naukrigulf:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/naukrigulf
    detail: No scraping; place job-alert JSON exports in data/alerts/naukrigulf/
  linkedin_jobs:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/linkedin_jobs
    detail: No LinkedIn scrape; alert/export JSON ingestion only
  indeed_uae:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/indeed_uae
    detail: No Indeed scrape; alert JSON ingestion only
  bayt:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/bayt
    detail: No Bayt scrape; alert JSON ingestion only
  gulftalent:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/gulftalent
    detail: No GulfTalent scrape; alert JSON ingestion only
  foundit_gulf:
    enabled: false
    status: planned_authorized_path_only

recruiters:
  michael_page:
    enabled: true
    status: alert_ingestion
    alert_dir: data/alerts/michael_page
    detail: Michael Page UAE — alert/export JSON only; no HTML scrape
  hays_uae:
    enabled: false
    status: planned
  robert_half:
    enabled: false
    status: planned
  tasc_outsourcing:
    enabled: false
    status: planned
  charterhouse_me:
    enabled: false
    status: planned
  discovered_mena:
    enabled: false
    status: planned
  kingston_stanley:
    enabled: false
    status: planned
  salt:
    enabled: false
